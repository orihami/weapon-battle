name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ユニットテスト(シミュレーション)
        run: npm test
      - name: ブラウザを用意
        run: npx playwright install --with-deps chromium
      - name: ブラウザテスト(実際にページを開いて対戦)
        run: npm run e2e
      - name: スクリーンショットを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-artifacts/
          retention-days: 3

  # テストが通ったら gh-pages ブランチへ公開(GitHub Pages)
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 公開するファイルだけ集める
        run: |
          mkdir _site
          cp -r index.html style.css src _site/
          touch _site/.nojekyll
      - name: 更新がすぐ反映されるよう、読み込むファイルに版番号を付ける
        # GitHub Pages はファイルを10分キャッシュさせるので、URLに ?v=版 を付けて古いファイルが使われないようにする
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s#from '\./\([a-z]*\)\.js'#from './\1.js?v=$V'#g" _site/src/*.js
          sed -i "s#href=\"style.css\"#href=\"style.css?v=$V\"#; s#src=\"src/main.js\"#src=\"src/main.js?v=$V\"#; s#<span id=\"version\">dev</span>#<span id=\"version\">$V</span>#" _site/index.html
          grep -n "?v=$V" _site/index.html _site/src/*.js
      - name: gh-pages へ push
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
